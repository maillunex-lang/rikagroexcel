name: Build Windows Portable
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify app files
        shell: pwsh
        run: |
          @('dist/index.html', 'dist/app.js', 'dist/engine.js', 'dist/style.css', 'dist/vendor/xlsx.full.min.js') | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Missing app file: $_" }
          }
      - name: Install dependencies
        run: npm install
      - name: Validate JavaScript
        run: npm run check
      - name: Build portable EXE
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Price-Bridge-Windows-Portable
          path: release/*.exe
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" release/*.exe --generate-notes --verify-tag
